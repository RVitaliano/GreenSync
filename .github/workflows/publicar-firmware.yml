name: Publicar firmware no backend

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: firmware-wroom-v1.0.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: publicar-firmware
  cancel-in-progress: false

jobs:
  registrar:
    if: ${{ github.event.release.prerelease != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ler a tag
        env:
          TAG_EVENTO: ${{ github.event.release.tag_name }}
          TAG_MANUAL: ${{ github.event.inputs.tag }}
        run: |
          TAG="${TAG_EVENTO:-$TAG_MANUAL}"
          if [[ ! "$TAG" =~ ^firmware-(wroom|s3)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag '$TAG' não segue firmware-<wroom|s3>-vX.Y.Z; nada a fazer."
            echo "PULAR=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ALVO=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "VERSAO=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - name: Baixar o binário e calcular o hash
        if: env.PULAR != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fw
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.bin' --dir fw
          N=$(ls fw/*.bin | wc -l)
          if [ "$N" -ne 1 ]; then echo "Esperava 1 arquivo .bin, achei $N"; exit 1; fi
          ARQ=$(basename fw/*.bin)
          echo "SHA256=$(sha256sum fw/*.bin | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARQ}" >> "$GITHUB_ENV"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notas.txt

      - name: Registrar no backend
        if: env.PULAR != '1'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          corpo=$(jq -n \
            --arg versao "$VERSAO" --arg url "$URL" --arg sha256 "$SHA256" \
            --arg notas "$(head -c 500 notas.txt)" \
            '{versao:$versao,url:$url,sha256:$sha256,notas:$notas}')
          codigo=$(curl --silent --show-error --output resposta.txt \
            --write-out '%{http_code}' \
            --retry 5 --retry-delay 20 --retry-connrefused --max-time 120 \
            -X PUT "${BACKEND_URL%/}/firmware/${ALVO}" \
            -H "X-Admin-Key: ${ADMIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$corpo")
          cat resposta.txt; echo
          if [ "$codigo" = "409" ]; then
            echo "Esta versão já está registrada no backend; nada a fazer."
            exit 0
          fi
          if [ "$codigo" -lt 200 ] || [ "$codigo" -ge 300 ]; then
            echo "Falhou com HTTP $codigo"
            exit 1
          fi
